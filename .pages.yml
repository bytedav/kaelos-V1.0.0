# Pages CMS Configuration File (https://pagescms.org)
# Configuración para Pages CMS - Kaelos Motos

media:
  input: public/uploads
  output: /uploads

content:
  - name: blog
    label: Blog Kaelos
    type: collection
    path: content/blog
    filename: "{primary}.md"

    view:
      primary: title
      fields:
        - category
        - date

    fields:
      - name: title
        label: Título
        type: string
        required: true

      - name: excerpt
        label: Resumen / Bajada
        type: text
        required: true

      - name: category
        label: Categoría
        type: select
        options:
          values:
            - Guías de Compra
            - Novedades
            - Rutas y Viajes

      - name: image
        label: Imagen de Portada
        type: image

      - name: readTime
        label: Tiempo de Lectura
        type: string

      - name: date
        label: Fecha de Publicación
        type: date

      - name: authorName
        label: Nombre del Autor
        type: string

      - name: authorRole
        label: Cargo / Especialidad del Autor
        type: string

      - name: authorAvatar
        label: Avatar del Autor
        type: image

      - name: tags
        label: Etiquetas
        type: list

      - name: likes
        label: Número de Me Gusta
        type: number

      - name: body
        label: Contenido del Artículo (Markdown)
        type: rich-text

  - name: faqs
    label: Preguntas Frecuentes
    type: collection
    path: content/faqs
    filename: "{primary}.md"

    fields:
      - name: title
        label: Pregunta
        type: string
        required: true

      - name: category
        label: Categoría
        type: select
        options:
          values:
            - Vender o Intercambiar
            - Comprar una Moto
            - Financiación y otros métodos de pago
            - Envíos y entregas
            - Garantías y seguros
            - Devoluciones

      - name: order
        label: Orden de visualización
        type: number

      - name: body
        label: Respuesta (Markdown)
        type: rich-text