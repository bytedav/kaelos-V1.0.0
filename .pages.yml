# Pages CMS Configuration File (https://pagescms.org)
# Configuración para Pages CMS - Kaelos Motos

media:
  input: public/uploads
  output: /uploads

content:
  - name: blog
    label: Blog Kaelos
    type: collection
    path: content/blog
    filename: "{primary}.md"

    view:
      primary: title
      fields:
        - category
        - date

    fields:
      - name: title
        label: Título
        type: string
        required: true

      - name: excerpt
        label: Resumen / Bajada
        type: text
        required: true

      - name: category
        label: Categoría
        type: select
        options:
          values:
            - Guías de Compra
            - Novedades
            - Rutas y Viajes

      - name: image
        label: Imagen de Portada
        type: image

      - name: readTime
        label: Tiempo de Lectura
        type: string

      - name: date
        label: Fecha de Publicación
        type: date

      - name: authorName
        label: Nombre del Autor
        type: string

      - name: authorRole
        label: Cargo / Especialidad del Autor
        type: string

      - name: authorAvatar
        label: Avatar del Autor
        type: image

      - name: body
        label: Contenido del Artículo (Markdown)
        type: rich-text

  - name: faqs
    label: Preguntas Frecuentes
    type: collection
    path: content/faqs
    filename: "{primary}.md"

    fields:
      - name: title
        label: Pregunta
        type: string
        required: true

      - name: category
        label: Categoría
        type: select
        options:
          values:
            - Vender o Intercambiar
            - Comprar una Moto
            - Financiación y otros métodos de pago
            - Envíos y entregas
            - Garantías y seguros
            - Devoluciones

      - name: body
        label: Respuesta (Markdown)
        type: rich-text

  - name: marcas
    label: Marcas de Motocicletas
    type: file
    path: src/data/brands.json
    fields:
      - name: brands
        label: Lista de Marcas de Motos
        type: list
        field:
          name: brand
          label: Nombre de Marca
          type: string

  - name: ciudades
    label: Ciudades de Perú
    type: file
    path: src/data/cities.json
    fields:
      - name: cities
        label: Lista de Ciudades
        type: list
        field:
          name: city
          label: Nombre de Ciudad
          type: string


